<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.0/css/bootstrap.min.css">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.16.0/umd/popper.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.0/js/bootstrap.min.js"></script>
    <title>Student Dashboard</title>
</head>
<body>
    <div class="container mt-4 justify-content-center">
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a href="#">Home</a></li>
            <li class="breadcrumb-item"><a href="#">Dashboard</a></li>
            <li class="breadcrumb-item active">My Courses</li>
        </ol>
        <br>
        <div class="row justify-content-center">
            <button class="btn btn-outline-primary btn-md">Start New Course</button>
        </div>
        <div class="mt-4 bg-warning p-3 rounded">
            <h4>My Progress <span class="badge badge-light">3 Courses</span></h4>
        </div><br>
        <div class="progress">
            <div class="progress-bar bg-success progress-bar-striped progress-bar-animated"  style="width: 70%;"  aria-valuemin="70" aria-valuemax="100">70% Completed</div>
        </div>
        <ul class="pagination align-items-center justify-content-center mt-4">
            <li class="page-item"><a class="page-link" href="#">Previous</a></li>
            <li class="page-item"><a class="page-link" href="#">1</a></li>
            <li class="page-item active"><a class="page-link" href="#">2</a></li>
            <li class="page-item"><a class="page-link" href="#">3</a></li>
            <li class="page-item"><a class="page-link" href="#">Next</a></li>
        </ul>
    </div>
</body>
</html>
