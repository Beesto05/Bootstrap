<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.0/css/bootstrap.min.css">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.16.0/umd/popper.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.0/js/bootstrap.min.js"></script>
    <title>Course Progress Dashboard</title>
</head>
<body>
    <div class="container mt-4">
        <ol class="breadcrumb float-left bg-light p-2 rounded">
            <li class="breadcrumb-item"><a href="#">Home</a></li>
            <li class="breadcrumb-item"><a href="#">Courses</a></li>
            <li class="breadcrumb-item active">Web Development</li>
        </ol>
        <br>

        <div class="mt-4 p-3 text-center rounded">
            <h4>Web Development Course <span class="badge badge-success">New</span></h4>
        </div><br>
        <label>HTML - 100%</label>
        <div class="progress mb-3">
            <div class="progress-bar bg-success progress-bar-striped"  style="width: 100%;">Completed</div>
        </div>
        <label>CSS - 75%</label>
        <div class="progress mb-3">
            <div class="progress-bar bg-primary progress-bar-striped progress-bar-animated"  style="width: 75%;">75% Completed</div>
        </div>
        <label>JavaScript - 50%</label>
        <div class="progress mb-3">
            <div class="progress-bar bg-warning"  style="width: 50%;">50% Completed</div>
        </div>
        <label>Bootstrap - 25%</label>
        <div class="progress mb-3">
            <div class="progress-bar bg-danger"  style="width: 25%;">25% Completed</div>
        </div><br><br>
        <div class="row justify-content-center">
            <button class="btn btn-outline-primary btn-md">Start</button>
            <button class="btn btn-outline-primary btn-md">Pause</button>
            <button class="btn btn-outline-primary btn-md">Reset</button>
        </div><br><br><br><br><br>
        <ul class="pagination align-items-center justify-content-center mt-4">
            <li class="page-item"><a class="page-link" href="#">&lt;</a></li>
            <li class="page-item active"><a class="page-link" href="#">1</a></li>
            <li class="page-item"><a class="page-link" href="#">2</a></li>
            <li class="page-item disabled"><a class="page-link" href="#">3</a></li>
            <li class="page-item"><a class="page-link" href="#">&gt;</a></li>
        </ul>
</body>
</html>
