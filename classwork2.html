<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.0/css/bootstrap.min.css">
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.16.0/umd/popper.min.js"></script>
  <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.0/js/bootstrap.min.js"></script>
    <title>Student Profile</title>
    <style>
        .quote{
            color: #13202c;
        }
        </style>
</head>
<body>
    <div class="container">
        <div class="row justify-content-center mt-4">
            <h3 class="display-4">Student Profile</h3>
        </div>
        <blockquote class="blockquote text-right">
            <p class="blockquote-footer">"Learning never exhausts the mind." – Leonardo da Vinci</p>
        </blockquote>
        <img src="https://media.istockphoto.com/id/1373258176/photo/little-african-american-school-boy-raising-hands-up-with-excitement-during-home-distance.jpg?s=612x612&w=0&k=20&c=ovy60H9_Ga6fKfAc2sL5BywZ_r0NiM6oPpC9YRAhcAM=" alt="Student Image" class="rounded mx-auto d-block rounded-circle"  style="max-width: 300px;">
        <table class="table table-bordered mt-4 text-center">
            <thead class="thead-dark">
                <tr>
                    <th>Attribute</th>
                    <th>Details</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>Name</td>
                    <td>John Doe</td>
                </tr>
                <tr>
                    <td>Age</td>
                    <td>20</td>
                </tr>
                <tr>
                    <td>Major</td>
                    <td>Computer Science</td>
                </tr>
                <tr>
                    <td>GPA</td>
                    <td>3.8</td>
                </tr>
            </tbody>

        </table>
        <div class="alert alert-info alert-dismissible fade show" role="alert">
            <p class="mb-0">Profile information updated successfully!</p>
            <button type="button" class="close" data-dismiss="alert" aria-label="Close">
                <span aria-hidden="true">&times;</span>
            </button>
        </div>
    </div>

</body>
</html>
